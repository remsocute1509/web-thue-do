services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mochymoon-cosplay
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - PORT=3000
    volumes:
      # Mount data folder for local fallback storage if not using cloud database
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
